<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Liniencodes OTN &mdash; BahnCenter</title>
  <style>
    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --surface2: #222535;
      --border:   #2e3248;
      --green:    #3b82f6;
      --red:      #f59e0b;
      --text:     #e8eaf0;
      --muted:    #8b90a8;
      --gold:     #c8a000;

      --rb13: #13a538;
      --rb22: #f39200;
      --re12: #ec6608;
      --rb21: #e30613;
      --re21: #2e9fff;
      --rb23: #0097d7;
      --rb26: #365c17;
      --rb27: #3cb85a;
      --rb28: #13a538;
      --rb32: #e30613;
      --rb76: #832c87;
      --rb46: #13a538;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER */
    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-logo-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .header-logo-eb {
      font-size: 1.7rem;
      font-weight: 900;
      background: linear-gradient(to right, var(--green), #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
      line-height: 1;
    }
    .header-logo-dot {
      width: 8px;
      height: 8px;
      background: var(--red);
      border-radius: 50%;
      margin-bottom: 2px;
    }
    .header-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--muted);
      flex: 1;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 0.35rem 0.8rem;
      background: none; border: 1px solid var(--border);
      border-radius: 6px; color: var(--muted);
      text-decoration: none; font-size: 0.8rem; font-weight: 500;
      transition: border-color 0.15s, color 0.15s;
    }
    .back-btn:hover { border-color: var(--muted); color: var(--text); }
    .header-badge {
      font-size: 0.7rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
    }

    .main-content { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }

    /* TABS */
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .tab-btn {
      padding: 0.5rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.15s;
    }
    .tab-btn:hover { border-color: var(--muted); color: var(--text); }
    .tab-btn.active { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }

    /* SEARCH */
    .search-wrap { position: relative; margin-bottom: 1rem; }
    .search-icon {
      position: absolute; left: 1rem; top: 50%;
      transform: translateY(-50%);
      color: var(--muted); font-size: 1rem; pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 0.8rem 2.8rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--muted); }
    .search-input::placeholder { color: var(--muted); }
    .search-clear {
      position: absolute; right: 1rem; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--muted); cursor: pointer;
      font-size: 1rem; display: none; padding: 0;
    }
    .search-clear.visible { display: block; }

    /* FILTER CHIPS */
    .filter-bar {
      display: flex; gap: 0.4rem;
      flex-wrap: wrap; margin-bottom: 1rem; align-items: center;
    }
    .filter-label { color: var(--muted); font-size: 0.8rem; }
    .chip {
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.78rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .chip[data-line="ALL"].active { background: var(--muted); border-color: var(--muted); color: #fff; }
    .chip[data-line="RB13"].active { background: var(--rb13); border-color: var(--rb13); color: #fff; }
    .chip[data-line="RB22"].active { background: var(--rb22); border-color: var(--rb22); color: #fff; }
    .chip[data-line="RE12"].active { background: var(--re12); border-color: var(--re12); color: #fff; }
    .chip[data-line="RB21"].active { background: var(--rb21); border-color: var(--rb21); color: #fff; }
    .chip[data-line="RE21"].active { background: var(--re21); border-color: var(--re21); color: #fff; }
    .chip[data-line="RB23"].active { background: var(--rb23); border-color: var(--rb23); color: #fff; }
    .chip[data-line="RB26"].active { background: var(--rb26); border-color: var(--rb26); color: #fff; }
    .chip[data-line="RB27"].active { background: var(--rb27); border-color: var(--rb27); color: #fff; }
    .chip[data-line="RB28"].active { background: var(--rb28); border-color: var(--rb28); color: #fff; }
    .chip[data-line="RB32"].active { background: var(--rb32); border-color: var(--rb32); color: #fff; }
    .chip[data-line="RB76"].active { background: var(--rb76); border-color: var(--rb76); color: #fff; }
    .chip[data-line="RB46"].active { background: var(--rb46); border-color: var(--rb46); color: #fff; }

    /* RESULT COUNT */
    .result-count { color: var(--muted); font-size: 0.82rem; margin-bottom: 0.75rem; }
    .result-count span { color: var(--text); font-weight: 600; }

    /* TABLE */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--surface2); }
    th {
      padding: 0.7rem 1rem;
      text-align: left;
      font-size: 0.72rem; font-weight: 700;
      color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 0.65rem 1rem;
      font-size: 0.88rem;
      border-top: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:hover td { background: rgba(59,130,246,0.04); }
    .mono { font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: 0.04em; }
    .code-cell { color: var(--gold); }
    .line-badge {
      display: inline-block;
      padding: 0.18rem 0.5rem;
      border-radius: 5px;
      font-size: 0.73rem; font-weight: 700;
      color: #fff; white-space: nowrap;
    }
    mark.hl { background: rgba(245,158,11,0.28); color: inherit; border-radius: 2px; padding: 0 1px; }
    .no-results { text-align: center; padding: 3rem; color: var(--muted); }
    .no-results-icon { font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.5; }

    /* DESTINATION GRID */
    .dest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 0.4rem;
    }
    .dest-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: border-color 0.15s;
    }
    .dest-card:hover { border-color: var(--border); }
    .dest-code { font-family: 'Courier New', monospace; font-weight: 700; font-size: 0.95rem; color: var(--gold); min-width: 38px; }
    .dest-name { font-size: 0.88rem; flex: 1; }
    .dest-op { font-size: 0.68rem; color: var(--muted); background: var(--surface2); padding: 0.12rem 0.35rem; border-radius: 4px; white-space: nowrap; }

    /* FIS */
    .fis-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 0.6rem;
    }
    .fis-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1.1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: border-color 0.15s;
    }
    .fis-card:hover { border-color: var(--border); }
    .fis-key-num {
      width: 42px; height: 42px;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem; font-weight: 700; font-family: monospace;
      color: var(--muted); flex-shrink: 0;
    }
    .fis-info { flex: 1; }
    .fis-announce { font-size: 0.88rem; margin-bottom: 0.2rem; }
    .fis-vt { font-size: 0.72rem; color: var(--muted); }
    .fis-vt span { color: var(--red); font-weight: 600; }

    /* LOGIN OVERLAY */
    #login-overlay {
      position: fixed; inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%; max-width: 360px;
      text-align: center;
    }
    .login-logo {
      display: inline-flex; align-items: center; gap: 0.4rem;
      margin-bottom: 1.25rem;
    }
    .login-logo-eb {
      font-size: 2.5rem; font-weight: 900;
      background: linear-gradient(to right, var(--green), #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -2px; line-height: 1;
    }
    .login-logo-dot {
      width: 9px; height: 9px;
      background: var(--red); border-radius: 50%;
      margin-bottom: 4px; flex-shrink: 0;
    }
    .login-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 0.35rem; }
    .login-sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 1.5rem; }
    .login-input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1.1rem; font-family: monospace;
      outline: none; text-align: center; letter-spacing: 0.25em;
      transition: border-color 0.2s;
      margin-bottom: 0.75rem;
    }
    .login-input:focus { border-color: var(--muted); }
    .login-input::placeholder { font-family: 'Segoe UI', system-ui, sans-serif; letter-spacing: normal; color: var(--muted); }
    .login-error {
      color: var(--red); font-size: 0.82rem;
      margin-bottom: 0.75rem; display: none;
    }
    .login-error.visible { display: block; }
    .login-btn {
      width: 100%; padding: 0.8rem;
      background: var(--red); border: none;
      border-radius: 10px; color: #fff;
      font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: opacity 0.15s;
    }
    .login-btn:hover { opacity: 0.85; }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border); }

    @media (max-width: 640px) {
      .app-header { padding: 0.7rem 1rem; }
      .main-content { padding: 0.9rem; }
      .header-title { display: none; }
      th, td { padding: 0.55rem 0.55rem; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="login-overlay">
  <div class="login-card">
    <div class="login-logo">
      <span style="font-size:2.5rem;line-height:1;">🚂</span><span class="login-logo-eb">BC</span>
      <span class="login-logo-dot"></span>
    </div>
    <h1 class="login-title">Liniencodes OTN</h1>
    <p class="login-sub">Interner Bereich &mdash; Passwort erforderlich</p>
    <form onsubmit="doLogin(event)">
      <input class="login-input" id="pw-input" type="password"
        placeholder="Passwort&hellip;" autocomplete="current-password" autofocus />
      <div class="login-error" id="login-error">Falsches Passwort. Bitte erneut versuchen.</div>
      <button class="login-btn" type="submit">Entsperren &#x1F513;</button>
    </form>
  </div>
</div>

<header class="app-header">
  <div class="header-logo-wrap">
    <span style="font-size:1.7rem;line-height:1;">🚂</span><span class="header-logo-eb">BC</span>
    <span class="header-logo-dot"></span>
  </div>
  <span class="header-title">FIS-Taufe &mdash; Liniencodes Ostth&uuml;ringennetz</span>
  <span class="header-badge">Stand 02/2026</span>
  <a class="back-btn" href="index.html">&#x2190; BahnCenter</a>
</header>

<div class="main-content">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('codes')">Liniencodes</button>
    <button class="tab-btn" onclick="switchTab('destinations')">Zugzielliste</button>
    <button class="tab-btn" onclick="switchTab('fis')">FIS-Tasten</button>
  </div>

  <!-- LINIENCODES -->
  <div id="tab-codes">
    <div class="search-wrap">
      <span class="search-icon">&#x1F50D;</span>
      <input class="search-input" id="codes-search" type="text"
        placeholder="Zugnummer, Liniencode oder Strecke&hellip;"
        oninput="filterCodes()" />
      <button class="search-clear" id="codes-clear" onclick="clearSearch('codes-search','codes-clear',filterCodes)">&#x2715;</button>
    </div>
    <div class="filter-bar">
      <span class="filter-label">Linie:</span>
      <button class="chip active" data-line="ALL" onclick="toggleLineFilter(this)">Alle</button>
      <button class="chip" data-line="RB13" onclick="toggleLineFilter(this)" style="color:var(--rb13)">RB13</button>
      <button class="chip" data-line="RB22" onclick="toggleLineFilter(this)" style="color:var(--rb22)">RB22</button>
      <button class="chip" data-line="RE12" onclick="toggleLineFilter(this)" style="color:var(--re12)">RE12</button>
      <button class="chip" data-line="RB21" onclick="toggleLineFilter(this)" style="color:var(--rb21)">RB21</button>
      <button class="chip" data-line="RE21" onclick="toggleLineFilter(this)" style="color:var(--re21)">RE21</button>
      <button class="chip" data-line="RB23" onclick="toggleLineFilter(this)" style="color:var(--rb23)">RB23</button>
      <button class="chip" data-line="RB26" onclick="toggleLineFilter(this)" style="color:var(--rb26)">RB26</button>
      <button class="chip" data-line="RB27" onclick="toggleLineFilter(this)" style="color:var(--rb27)">RB27</button>
      <button class="chip" data-line="RB28" onclick="toggleLineFilter(this)" style="color:var(--rb28)">RB28</button>
      <button class="chip" data-line="RB32" onclick="toggleLineFilter(this)" style="color:var(--rb32)">RB32</button>
      <button class="chip" data-line="RB76" onclick="toggleLineFilter(this)" style="color:var(--rb76)">RB76</button>
      <button class="chip" data-line="RB46" onclick="toggleLineFilter(this)" style="color:var(--rb46)">RB46 (STB)</button>
    </div>
    <div class="result-count" id="codes-count"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Zugnr.</th><th>Liniencode</th><th>Strecke</th><th>Linie</th><th>Anzeigetext</th></tr>
        </thead>
        <tbody id="codes-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- ZUGZIELLISTE -->
  <div id="tab-destinations" style="display:none">
    <div class="search-wrap">
      <span class="search-icon">&#x1F50D;</span>
      <input class="search-input" id="dest-search" type="text"
        placeholder="Zielcode oder Ortsname&hellip;"
        oninput="filterDestinations()" />
      <button class="search-clear" id="dest-clear" onclick="clearSearch('dest-search','dest-clear',filterDestinations)">&#x2715;</button>
    </div>
    <div class="result-count" id="dest-count"></div>
    <div id="dest-grid" class="dest-grid"></div>
  </div>

  <!-- FIS-TASTEN -->
  <div id="tab-fis" style="display:none">
    <div class="fis-grid" id="fis-grid"></div>
  </div>
</div>

function doLogin(e) {
  e.preventDefault();
  var pw = document.getElementById('pw-input').value;
  try {
    var bytes = CryptoJS.AES.decrypt(CIPHER, pw);
    var plain = bytes.toString(CryptoJS.enc.Utf8);
    if (!plain) throw new Error('bad password');
    APP_DATA = JSON.parse(plain);
    document.getElementById('login-overlay').style.display = 'none';
    filterCodes();
    filterDestinations();
    renderFis();
  } catch (err) {
    document.getElementById('login-error').classList.add('visible');
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}

var activeLineFilter = 'ALL';

var LINE_COLORS = {
  RB13:'#13a538', RB22:'#f39200', RE12:'#ec6608',
  RB21:'#e30613', RE21:'#2e9fff', RB23:'#0097d7',
  RB26:'#365c17', RB27:'#3cb85a', RB28:'#13a538',
  RB32:'#e30613', RB76:'#832c87', RB46:'#13a538'
};

function getLineColor(line) {
  return LINE_COLORS[line.split('/')[0]] || '#7a9a80';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, term) {
  var safe = escHtml(String(text));
  if (!term) return safe;
  var esc = term.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&');
  return safe.replace(new RegExp('(' + esc + ')', 'gi'), '<mark class="hl">$1</mark>');
}

function switchTab(name) {
  ['codes','destinations','fis'].forEach(function(t) {
    document.getElementById('tab-' + t).style.display = (t === name) ? '' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach(function(btn, i) {
    btn.classList.toggle('active', ['codes','destinations','fis'][i] === name);
  });
}

function toggleLineFilter(btn) {
  document.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('active'); });
  btn.classList.add('active');
  activeLineFilter = btn.dataset.line;
  filterCodes();
}

function filterCodes() {
  var raw = document.getElementById('codes-search').value;
  var term = raw.trim().toLowerCase();
  document.getElementById('codes-clear').classList.toggle('visible', raw.length > 0);
  var rows = APP_DATA.lineCodes.filter(function(r) {
    if (activeLineFilter !== 'ALL' && r.line.indexOf(activeLineFilter) === -1) return false;
    if (!term) return true;
    return r.trainNumber.toLowerCase().indexOf(term) !== -1 ||
           r.lineCode.toLowerCase().indexOf(term) !== -1 ||
           r.route.toLowerCase().indexOf(term) !== -1 ||
           r.line.toLowerCase().indexOf(term) !== -1 ||
           r.display.toLowerCase().indexOf(term) !== -1;
  });
  document.getElementById('codes-count').innerHTML = '<span>' + rows.length + '</span> Eintr&auml;ge';
  var tbody = document.getElementById('codes-tbody');
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5"><div class="no-results"><div class="no-results-icon">&#x1F50D;</div>Keine Ergebnisse</div></td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(function(r) {
    return '<tr>' +
      '<td class="mono">' + highlight(r.trainNumber, term) + '</td>' +
      '<td class="mono code-cell">' + highlight(r.lineCode, term) + '</td>' +
      '<td>' + highlight(r.route, term) + '</td>' +
      '<td><span class="line-badge" style="background:' + getLineColor(r.line) + '">' + escHtml(r.line) + '</span></td>' +
      '<td>' + highlight(r.display, term) + '</td>' +
    '</tr>';
  }).join('');
}

function filterDestinations() {
  var raw = document.getElementById('dest-search').value;
  var term = raw.trim().toLowerCase();
  document.getElementById('dest-clear').classList.toggle('visible', raw.length > 0);
  var items = APP_DATA.destinations.filter(function(d) {
    if (!term) return true;
    return d.code.indexOf(term) !== -1 ||
           d.name.toLowerCase().indexOf(term) !== -1 ||
           d.operator.toLowerCase().indexOf(term) !== -1;
  });
  document.getElementById('dest-count').innerHTML = '<span>' + items.length + '</span> Ziele';
  var grid = document.getElementById('dest-grid');
  if (items.length === 0) {
    grid.innerHTML = '<div class="no-results" style="grid-column:1/-1"><div class="no-results-icon">&#x1F50D;</div>Keine Ergebnisse</div>';
    return;
  }
  grid.innerHTML = items.map(function(d) {
    return '<div class="dest-card">' +
      '<span class="dest-code">' + highlight(d.code, term) + '</span>' +
      '<span class="dest-name">' + highlight(d.name, term) + '</span>' +
      (d.operator ? '<span class="dest-op">' + escHtml(d.operator) + '</span>' : '') +
    '</div>';
  }).join('');
}

function renderFis() {
  document.getElementById('fis-grid').innerHTML = APP_DATA.fisKeys.map(function(k) {
    return '<div class="fis-card">' +
      '<div class="fis-key-num">' + escHtml(k.key) + '</div>' +
      '<div class="fis-info">' +
        '<div class="fis-announce">' + escHtml(k.announcement) + '</div>' +
        (k.vt301337 ? '<div class="fis-vt">VT 301&ndash;337: <span>' + escHtml(k.vt301337) + '</span></div>' : '') +
      '</div>' +
    '</div>';
  }).join('');
}

function clearSearch(inputId, clearId, fn) {
  document.getElementById(inputId).value = '';
  document.getElementById(clearId).classList.remove('visible');
  fn();
}

</script>
</body>
</html>
