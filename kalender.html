<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Kalendernotiz &mdash; BahnCenter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --deep:     #0f0f10;
      --bg:       #141415;
      --surface:  #19191b;
      --raised:   #232325;
      --line:     rgba(237, 237, 237, 0.08);
      --line-2:   rgba(237, 237, 237, 0.16);
      --text:     #ededed;
      --text-2:   #a1a1a6;
      --muted:    #85858b;
      --amber:    #f5a524;
      --on-amber: #1a1300;
      --red:      #e5484d;
      --ease:     cubic-bezier(0.22, 1, 0.36, 1);
      --sans:     'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --mono:     'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color-scheme: dark;
      -webkit-font-smoothing: antialiased;
    }
    :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    .ico {
      width: 16px; height: 16px; flex-shrink: 0;
      fill: none; stroke: currentColor; stroke-width: 1.5;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── NAV ─────────────────────────────────────────── */
    .top-nav {
      height: 56px; padding: 0 24px;
      display: flex; align-items: center; gap: 12px;
      background: var(--deep);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; }
    .brand-mark {
      display: inline-flex; align-items: center; justify-content: center;
      height: 24px; padding: 0 6px; border-radius: 4px;
      background: var(--amber); color: var(--on-amber);
      font: 600 13px/1 var(--mono);
    }
    .brand-name { font-size: 16px; font-weight: 500; }
    .nav-sep  { color: var(--muted); }
    .nav-page { font-size: 14px; color: var(--text-2); }
    .back-btn {
      margin-left: auto;
      height: 32px; padding: 0 12px;
      display: inline-flex; align-items: center; gap: 8px;
      border-radius: 8px; border: 1px solid var(--line-2);
      color: var(--text-2); text-decoration: none; font-size: 13px;
      transition: color 150ms var(--ease), background-color 150ms var(--ease);
    }
    .back-btn:hover { color: var(--text); background: var(--raised); }

    /* ── LAYOUT ──────────────────────────────────────── */
    main {
      flex: 1;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .page-head h1 { font-size: 24px; line-height: 1.2; font-weight: 500; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── FELDER ──────────────────────────────────────── */
    .field { display: flex; flex-direction: column; gap: 8px; }
    .field label { font-size: 13px; font-weight: 500; color: var(--text-2); }
    .field label .opt { color: var(--muted); font-weight: 400; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .group { display: flex; flex-direction: column; gap: 8px; }

    input, textarea {
      width: 100%;
      height: 44px;
      background: var(--raised);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      font: inherit; font-size: 16px;
      padding: 0 12px;
      outline: none;
      transition: border-color 150ms var(--ease);
    }
    input:focus, textarea:focus { border-color: var(--amber); }
    input::placeholder, textarea::placeholder { color: #5c5c61; }
    input.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    textarea { height: auto; min-height: 96px; padding: 12px; resize: vertical; line-height: 22px; }

    .date-line { display: flex; gap: 8px; }
    .date-line input { flex: 1; min-width: 0; font-variant-numeric: tabular-nums; }
    .step-btn {
      flex-shrink: 0; width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: var(--raised); border: 1px solid var(--line); border-radius: 10px;
      color: var(--text-2); cursor: pointer; touch-action: manipulation;
      transition: color 150ms var(--ease), border-color 150ms var(--ease);
    }
    .step-btn:hover { color: var(--text); border-color: var(--line-2); }
    .step-btn:active { transform: scale(0.97); }

    .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .chip {
      height: 32px; padding: 0 4px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text-2);
      font: inherit; font-size: 13px;
      cursor: pointer; touch-action: manipulation;
      transition: color 150ms var(--ease), background-color 150ms var(--ease), border-color 150ms var(--ease);
    }
    .chip:hover { color: var(--text); border-color: var(--line-2); }
    .chip.active { background: var(--raised); border-color: var(--line-2); color: var(--text); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); }

    .hint { font-size: 13px; line-height: 20px; color: var(--muted); }

    .reset-btn {
      align-self: flex-start;
      background: none; border: none; padding: 0;
      color: var(--muted); font: inherit; font-size: 13px; cursor: pointer;
      text-decoration: underline; text-underline-offset: 3px;
      transition: color 150ms var(--ease);
    }
    .reset-btn:hover { color: var(--text); }

    /* ── ZUSAMMENFASSUNG ─────────────────────────────── */
    .summary { display: flex; flex-direction: column; gap: 4px; }
    .summary-title { font-size: 16px; line-height: 22px; font-weight: 500; word-break: break-word; }
    .summary-when  { font-size: 13px; line-height: 20px; color: var(--amber); font-variant-numeric: tabular-nums; }
    .summary-desc  {
      margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line);
      font-size: 14px; line-height: 20px; color: var(--text-2);
      white-space: pre-wrap; word-break: break-word;
    }
    .summary-desc:empty { display: none; }
    .section-label { font-size: 13px; color: var(--muted); }
    .section-label b { color: var(--text-2); font-weight: 500; }
    .more-label { margin-top: 8px; }

    /* ── KALENDER-BUTTONS ────────────────────────────── */
    .device { font-size: 13px; color: var(--muted); }
    .device b { color: var(--text-2); font-weight: 500; }
    /* Badges im Stil der Store-Buttons */
    .cal-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
    .cal-btn {
      display: flex; align-items: center; gap: 12px;
      width: 100%; height: 56px;
      padding: 0 16px;
      border-radius: 10px;
      border: 1px solid #a6a6a6;
      background: #000;
      color: #fff;
      font: inherit; text-align: left; cursor: pointer;
      touch-action: manipulation;
      transition: border-color 150ms var(--ease), background-color 150ms var(--ease);
    }
    .cal-btn:hover { border-color: #fff; background: #0a0a0a; }
    .cal-btn:active { transform: scale(0.98); }
    .cal-btn .logo { width: 28px; height: 28px; flex-shrink: 0; fill: var(--c); }
    .cal-btn .txt  { display: flex; flex-direction: column; min-width: 0; }
    .cal-btn .small { font-size: 11px; line-height: 14px; color: #d0d0d0; white-space: nowrap; }
    .cal-btn .big   { font-size: 18px; line-height: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Andere Geräte: gleiche Badges, etwas kleiner */
    #cal-more .cal-btn { height: 48px; border-color: #5c5c5c; }
    #cal-more .cal-btn:hover { border-color: #a6a6a6; }
    #cal-more .cal-btn .logo { width: 22px; height: 22px; }
    #cal-more .cal-btn .big { font-size: 15px; line-height: 20px; }

    /* Logofarben */
    .c-google  { --c: #4285f4; }
    .c-apple   { --c: #ffffff; }
    .c-android { --c: #3ddc84; }
    .c-outlook { --c: #1490df; }

    .cal-hint:empty { display: none; }

    .toast {
      position: fixed; left: 50%; bottom: 20px;
      transform: translate(-50%, 8px);
      background: var(--raised); color: var(--text);
      border: 1px solid var(--line-2);
      padding: 12px 16px; border-radius: 10px;
      font-size: 14px;
      opacity: 0; pointer-events: none;
      transition: opacity 200ms var(--ease), transform 200ms var(--ease);
      max-width: calc(100% - 32px); text-align: center;
    }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    .toast.err { border-color: var(--red); }

    footer {
      padding: 20px 24px; text-align: center;
      color: var(--muted); font-size: 12px;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 560px) {
      .top-nav { height: 52px; padding: 0 16px; }
      .brand-name { display: none; }
      main { padding: 20px 12px 40px; gap: 12px; }
      .card { padding: 16px; }
      .row-3 { grid-template-columns: 1fr 1fr; }
      .row-3 .field:last-child { grid-column: 1 / -1; }
    }
    @media (max-width: 340px) {
      .row-2, .row-3 { grid-template-columns: 1fr; }
      .chip { font-size: 12px; }
    }
  </style>
</head>

<header class="top-nav">
  <a class="brand" href="index.html"><span class="brand-mark">BC</span><span class="brand-name">BahnCenter</span></a>
  <span class="nav-sep">/</span>
  <span class="nav-page">Kalendernotiz</span>
  <a class="back-btn" href="index.html"><svg class="ico"><use href="#i-back"/></svg>&Uuml;bersicht</a>
</header>

<main>
  <div class="page-head">
    <h1>Kalendernotiz</h1>
  </div>

  <form class="card" id="form" autocomplete="off" onsubmit="return false">
    <div class="group">
      <div class="field">
        <label for="date">Datum</label>
        <div class="date-line">
          <button type="button" class="step-btn" id="prev-day" aria-label="Einen Tag zur&uuml;ck"><svg class="ico"><use href="#i-left"/></svg></button>
          <input type="date" id="date" required>
          <button type="button" class="step-btn" id="next-day" aria-label="Einen Tag vor"><svg class="ico"><use href="#i-right"/></svg></button>
        </div>
      </div>
      <div class="chips" id="quick-dates">
        <button type="button" class="chip" data-offset="-2">Vorgestern</button>
        <button type="button" class="chip" data-offset="-1">Gestern</button>
        <button type="button" class="chip" data-offset="0">Heute</button>
        <button type="button" class="chip" data-offset="1">Morgen</button>
      </div>
    </div>

    <div class="group">
      <div class="row-2">
        <div class="field">
          <label for="start">Beginn <span class="opt">optional</span></label>
          <input type="time" id="start">
        </div>
        <div class="field">
          <label for="end">Ende <span class="opt">optional</span></label>
          <input type="time" id="end">
        </div>
      </div>
      <p class="hint">Ohne Uhrzeit ganzt&auml;gig. Ende vor Beginn z&auml;hlt als Folgetag.</p>
    </div>

    <div class="row-3">
      <div class="field">
        <label for="shift">Schichtnummer</label>
        <input type="text" class="mono" id="shift" placeholder="1204" enterkeyhint="next">
      </div>
      <div class="field">
        <label for="vt">VT-Nummer</label>
        <input type="text" class="mono" id="vt" placeholder="650 017" enterkeyhint="next">
      </div>
      <div class="field">
        <label for="train">Zugnummer</label>
        <input type="text" class="mono" id="train" inputmode="numeric" placeholder="80123" enterkeyhint="next">
      </div>
    </div>

    <div class="field">
      <label for="note">Bemerkung</label>
      <textarea id="note" placeholder="Freitext"></textarea>
    </div>

    <button type="button" class="reset-btn" id="reset">Felder leeren</button>
  </form>

  <section class="card">
    <div class="section-label">Vorschau</div>
    <div class="summary" aria-live="polite">
      <div class="summary-title" id="pv-title"></div>
      <div class="summary-when" id="pv-when"></div>
      <div class="summary-desc" id="pv-desc"></div>
    </div>
  </section>

  <section class="card">
    <div class="section-label" id="device"></div>
    <div class="cal-list" id="cal-primary"></div>
    <p class="hint cal-hint" id="cal-hint"></p>
    <div class="section-label more-label" id="more-wrap">Andere Ger&auml;te</div>
    <div class="cal-list" id="cal-more"></div>
  </section>
</main>

<footer>BahnCenter &middot; Ostth&uuml;ringennetz &middot; nur f&uuml;r den internen Gebrauch</footer>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var f = {
    date: $('date'), start: $('start'), end: $('end'),
    shift: $('shift'), vt: $('vt'), train: $('train'), note: $('note')
  };

  /* ── Datum ─────────────────────────────────────────── */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function toIso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseIso(s) {
    var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    return p ? new Date(+p[1], +p[2] - 1, +p[3]) : null;
  }
  function addDays(d, n) { var c = new Date(d.getFullYear(), d.getMonth(), d.getDate()); c.setDate(c.getDate() + n); return c; }
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function setDate(d) { f.date.value = toIso(d); update(); }
  function shiftDate(n) { setDate(addDays(parseIso(f.date.value) || today(), n)); }

  var longFmt  = new Intl.DateTimeFormat('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  $('prev-day').addEventListener('click', function () { shiftDate(-1); });
  $('next-day').addEventListener('click', function () { shiftDate(1); });
  Array.prototype.forEach.call(document.querySelectorAll('#quick-dates .chip'), function (b) {
    b.addEventListener('click', function () { setDate(addDays(today(), +b.dataset.offset)); });
  });

  /* ── Eintrag zusammenbauen ─────────────────────────── */
  function val(el) { return el.value.trim(); }

  function buildEvent() {
    var d = parseIso(f.date.value);
    if (!d) return null;
    var shift = val(f.shift), vt = val(f.vt), train = val(f.train), note = f.note.value.trim();

    var parts = [];
    if (shift) parts.push('Schicht ' + shift);
    if (train) parts.push('Zug ' + train);
    if (vt)    parts.push('VT ' + vt);
    var title = parts.length ? parts.join(' \u00B7 ') : 'Dienstnotiz';

    var lines = [];
    if (shift) lines.push('Schicht: ' + shift);
    if (vt)    lines.push('VT: ' + vt);
    if (train) lines.push('Zug: ' + train);
    if (note)  { if (lines.length) lines.push(''); lines.push(note); }

    var ev = {
      title: title, desc: lines.join('\n'),
      shift: shift, vt: vt, train: train, note: note,
      allDay: true, start: d, end: addDays(d, 1)
    };
    var st = f.start.value, en = f.end.value;
    if (st) {
      var s = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +st.slice(0, 2), +st.slice(3, 5));
      var e;
      if (en) {
        e = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +en.slice(0, 2), +en.slice(3, 5));
        if (e <= s) e.setDate(e.getDate() + 1);
      } else {
        e = new Date(s.getTime() + 60 * 60 * 1000);
      }
      ev.allDay = false; ev.start = s; ev.end = e;
    }
    return ev;
  }

  /* Format-Helfer */
  function ymd(d)   { return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
  function local(d) { return ymd(d) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00'; }
  function isoLocal(d) { return toIso(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':00'; }
  function utcStamp(d) {
    return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' +
      pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
  }
  function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  /* ── Geräte-Erkennung ──────────────────────────────── */
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var isMac = !isIOS && /Macintosh|Mac OS X/.test(ua);
  var isWin = /Windows/i.test(ua);
  var iosNonSafari = isIOS && /CriOS|FxiOS|EdgiOS|OPiOS|GSA\/|FBAN|FBAV|Instagram|Line\//.test(ua);

  var deviceName = isIOS ? 'iPhone / iPad' : isAndroid ? 'Android' : isMac ? 'Mac' : isWin ? 'Windows' : 'unbekannt';

  /* ── Direkt eintragen ──────────────────────────────── */
  function openUrl(url) {
    var w = window.open(url, '_blank', 'noopener');
    if (!w) location.href = url;
  }

  function googleUrl(ev) {
    var dates = ev.allDay ? ymd(ev.start) + '/' + ymd(ev.end) : local(ev.start) + '/' + local(ev.end);
    var p = 'action=TEMPLATE&text=' + encodeURIComponent(ev.title) + '&dates=' + dates + '&ctz=Europe%2FBerlin';
    if (ev.desc) p += '&details=' + encodeURIComponent(ev.desc);
    return 'https://calendar.google.com/calendar/render?' + p;
  }

  function outlookUrl(ev) {
    var p = 'path=%2Fcalendar%2Faction%2Fcompose&rru=addevent&subject=' + encodeURIComponent(ev.title);
    if (ev.allDay) p += '&startdt=' + toIso(ev.start) + '&enddt=' + toIso(ev.end) + '&allday=true';
    else p += '&startdt=' + encodeURIComponent(isoLocal(ev.start)) + '&enddt=' + encodeURIComponent(isoLocal(ev.end)) + '&allday=false';
    if (ev.desc) p += '&body=' + encodeURIComponent(ev.desc);
    return 'https://outlook.live.com/calendar/0/deeplink/compose?' + p;
  }

  // Android: öffnet direkt den "Neuer Termin"-Dialog der Kalender-App.
  // Kann der Browser das nicht, springt er automatisch zu Google Kalender.
  function androidIntent(ev) {
    var begin, end;
    if (ev.allDay) {
      // Ganztägige Termine erwartet Android als UTC-Mitternacht
      begin = Date.UTC(ev.start.getFullYear(), ev.start.getMonth(), ev.start.getDate());
      end   = Date.UTC(ev.end.getFullYear(), ev.end.getMonth(), ev.end.getDate());
    } else {
      begin = ev.start.getTime(); end = ev.end.getTime();
    }
    var e = encodeURIComponent;
    return 'intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/event;' +
      'S.title=' + e(ev.title) + ';' +
      (ev.desc ? 'S.description=' + e(ev.desc) + ';' : '') +
      'l.beginTime=' + begin + ';l.endTime=' + end + ';' +
      'B.allDay=' + (ev.allDay ? 'true' : 'false') + ';' +
      'S.browser_fallback_url=' + e(googleUrl(ev)) + ';end';
  }

  // iPhone/iPad: Safari zeigt den Termin direkt mit "Zum Kalender hinzufügen" an,
  // ohne dass eine Datei gespeichert wird.
  function icsEscape(s) {
    return s.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  }
  function fold(line) {
    var out = [], cur = '', bytes = 0;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i], code = line.charCodeAt(i);
      if (code >= 0xD800 && code <= 0xDBFF && i + 1 < line.length) ch += line[++i];
      var b = unescape(encodeURIComponent(ch)).length;
      if (bytes + b > 75) { out.push(cur); cur = ' '; bytes = 1; }
      cur += ch; bytes += b;
    }
    out.push(cur);
    return out.join('\r\n');
  }
  function appleEvent(ev) {
    var L = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//BahnCenter//Kalendernotiz//DE', 'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      'UID:' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10) + '@bahncenter',
      'DTSTAMP:' + utcStamp(new Date())
    ];
    if (ev.allDay) L.push('DTSTART;VALUE=DATE:' + ymd(ev.start), 'DTEND;VALUE=DATE:' + ymd(ev.end), 'TRANSP:TRANSPARENT');
    else L.push('DTSTART:' + local(ev.start), 'DTEND:' + local(ev.end));
    L.push('SUMMARY:' + icsEscape(ev.title));
    if (ev.desc) L.push('DESCRIPTION:' + icsEscape(ev.desc));
    L.push('END:VEVENT', 'END:VCALENDAR');
    // Safari blockiert data:-Links; ein Blob mit text/calendar im selben Tab
    // öffnet dagegen den "Zum Kalender hinzufügen"-Dialog.
    var blob = new Blob([L.map(fold).join('\r\n') + '\r\n'], { type: 'text/calendar;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    location.href = url;
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }

  var TARGETS = {
    google:  { name: 'Google Kalender', sub: 'alle Ger\u00E4te',
               run: function (ev) { openUrl(googleUrl(ev)); } },
    apple:   { name: 'Apple Kalender', sub: 'iPhone & iPad',
               run: function (ev) {
                 if (!isIOS) { toast('Apple Kalender geht nur direkt auf dem iPhone oder iPad', true); return; }
                 appleEvent(ev);
               } },
    android: { name: 'Android-Kalender', sub: 'Android-Handy',
               run: function (ev) {
                 if (!isAndroid) { toast('Android-Kalender geht nur direkt auf dem Android-Handy', true); return; }
                 location.href = androidIntent(ev);
               } },
    outlook: { name: 'Outlook.com', sub: 'alle Ger\u00E4te',
               run: function (ev) { openUrl(outlookUrl(ev)); } }
  };

  var primary;
  if (isIOS)          primary = ['apple'];
  else if (isAndroid) primary = ['android', 'google'];
  else if (isWin)     primary = ['google', 'outlook'];
  else                primary = ['google'];
  var order = {
    primary: primary,
    more: ['google', 'apple', 'android', 'outlook'].filter(function (k) { return primary.indexOf(k) < 0; })
  };

  function makeBtn(key, primary, alt) {
    var t = TARGETS[key];
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'cal-btn c-' + key + (alt ? '' : ' primary');
    b.setAttribute('aria-label', 'In ' + t.name + ' eintragen');
    var NS = 'http://www.w3.org/2000/svg';
    var logo = document.createElementNS(NS, 'svg');
    logo.setAttribute('class', 'logo'); logo.setAttribute('aria-hidden', 'true');
    var use = document.createElementNS(NS, 'use');
    use.setAttribute('href', '#l-' + key);
    logo.appendChild(use);
    var txt = document.createElement('span'); txt.className = 'txt';
    var sm = document.createElement('span'); sm.className = 'small';
    sm.textContent = alt ? 'Für ' + t.sub : 'Eintragen in';
    var big = document.createElement('span'); big.className = 'big'; big.textContent = t.name;
    txt.appendChild(sm); txt.appendChild(big);
    b.appendChild(logo); b.appendChild(txt);
    b.addEventListener('click', function () {
      var ev = buildEvent();
      if (!ev) { toast('Bitte ein g\u00FCltiges Datum w\u00E4hlen', true); f.date.focus(); return; }
      t.run(ev);
    });
    return b;
  }
  order.primary.forEach(function (k, i) { $('cal-primary').appendChild(makeBtn(k, i === 0)); });
  order.more.forEach(function (k) { $('cal-more').appendChild(makeBtn(k, false, true)); });
  if (!order.more.length) $('more-wrap').hidden = true;

  $('device').innerHTML = 'Erkanntes Ger\u00E4t: <b></b>';
  $('device').querySelector('b').textContent = deviceName;
  $('cal-hint').textContent = iosNonSafari
    ? 'Apple Kalender klappt nur in Safari. In Chrome oder App-Browsern die Seite bitte in Safari \u00F6ffnen oder Google Kalender nehmen.'
    : isMac
      ? 'Apple Kalender am Mac: Google oder Outlook nehmen, wenn das Konto dort verbunden ist.'
      : '';

  /* ── Vorschau ──────────────────────────────────────── */
  function update() {
    var d = parseIso(f.date.value);
    var t = today();
    Array.prototype.forEach.call(document.querySelectorAll('#quick-dates .chip'), function (b) {
      b.classList.toggle('active', !!d && toIso(addDays(t, +b.dataset.offset)) === toIso(d));
    });
    var ev = buildEvent();
    if (!ev) {
      $('pv-title').textContent = 'Bitte ein Datum w\u00E4hlen';
      $('pv-when').textContent = '';
      $('pv-desc').textContent = '';
      return;
    }
    $('pv-title').textContent = ev.title;
    $('pv-desc').textContent = ev.desc;
    $('pv-when').textContent = longFmt.format(ev.start) + ' \u00B7 ' + (ev.allDay ? 'ganzt\u00E4gig'
      : hm(ev.start) + '\u2013' + hm(ev.end) + ' Uhr' + (toIso(ev.end) !== toIso(ev.start) ? ' (+1 Tag)' : ''));
  }
  Object.keys(f).forEach(function (k) { f[k].addEventListener('input', update); });

  $('reset').addEventListener('click', function () {
    ['start', 'end', 'shift', 'vt', 'train', 'note'].forEach(function (k) { f[k].value = ''; });
    setDate(today());
  });

  ['shift', 'vt', 'train'].forEach(function (k, i, arr) {
    f[k].addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); (arr[i + 1] ? f[arr[i + 1]] : f.note).focus(); }
    });
  });

  /* ── Toast ─────────────────────────────────────────── */
  var toastTimer;
  function toast(msg, err) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.toggle('err', !!err);
    el.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('visible'); }, 3200);
  }

  setDate(today());
})();
</script>

</body>
</html>
